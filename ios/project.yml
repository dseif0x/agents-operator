# XcodeGen spec for the iOS wrapper app: `cd ios && xcodegen generate`.
# CI (.github/workflows/ios.yml) builds an unsigned IPA from it.
name: Agents
options:
  bundleIdPrefix: io.github.dseif0x
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Agents:
    type: application
    platform: iOS
    sources:
      - path: Agents
    info:
      path: Agents/Info.plist
      properties:
        CFBundleDisplayName: Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Take a photo to attach to a chat.
        NSPhotoLibraryUsageDescription: Pick a photo to attach to a chat.
        NSPhotoLibraryAddUsageDescription: Save an image from a chat.
        NSMicrophoneUsageDescription: Record audio when the web app asks for it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dseif0x.agents
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
    scheme: {}
