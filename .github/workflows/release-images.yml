name: release-images

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  # The agent CLIs' current versions, passed to the runner build so its npm
  # layer is rebuilt when one of them has a new release and comes from the
  # cache otherwise. Resolved once, so both platforms get the same.
  versions:
    name: agent CLI versions
    runs-on: ubuntu-latest
    outputs:
      claude-code: ${{ steps.v.outputs.claude-code }}
      opencode: ${{ steps.v.outputs.opencode }}
      codex: ${{ steps.v.outputs.codex }}
    steps:
      - id: v
        run: |
          for pkg in @anthropic-ai/claude-code opencode-ai @openai/codex; do
            npm view "$pkg" version | grep -qE '^[0-9]+\.[0-9]+' || { echo "cannot resolve $pkg"; exit 1; }
          done
          {
            echo "claude-code=$(npm view @anthropic-ai/claude-code version)"
            echo "opencode=$(npm view opencode-ai version)"
            echo "codex=$(npm view @openai/codex version)"
          } | tee -a "$GITHUB_OUTPUT"

  # Each platform builds on a runner of its own architecture (no QEMU) and is
  # pushed by digest; the merge job below puts the tags on the multi-arch
  # index.
  build:
    name: build ${{ matrix.name }} (${{ matrix.arch }})
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [agents-operator, agents-operator-runner]
        arch: [amd64, arm64]
        include:
          - name: agents-operator
            file: docker/hub.Dockerfile
          - name: agents-operator-runner
            file: docker/runner.Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_name }}
            CLAUDE_CODE_VERSION=${{ needs.versions.outputs.claude-code }}
            OPENCODE_VERSION=${{ needs.versions.outputs.opencode }}
            CODEX_VERSION=${{ needs.versions.outputs.codex }}
      - name: save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: publish ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [agents-operator, agents-operator-runner]
    outputs:
      digest-agents-operator: ${{ steps.digest.outputs.agents-operator }}
      digest-agents-operator-runner: ${{ steps.digest.outputs.agents-operator-runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - name: create the multi-arch index
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in *; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
      - id: digest
        run: |
          d=$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "${{ matrix.name }}=$d" >> "$GITHUB_OUTPUT"
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless, non-blocking)
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE@${{ steps.digest.outputs.digest }}"

  release:
    name: github release
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release notes
        run: |
          {
            echo "## Images"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/agents-operator@${{ needs.merge.outputs.digest-agents-operator }}"
            echo "ghcr.io/${{ github.repository_owner }}/agents-operator-runner@${{ needs.merge.outputs.digest-agents-operator-runner }}"
            echo '```'
            echo
            echo "Both images are multi-arch (linux/amd64, linux/arm64), carry SBOM and provenance attestations, and are signed with cosign (keyless)."
            echo
            echo "## Chart"
            echo
            echo "The Helm chart \`agents-operator-${GITHUB_REF_NAME#v}\` is published by the release-chart workflow to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
