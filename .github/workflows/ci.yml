name: ci

# Pull requests are the gate. Tags run the release workflows. Nothing runs
# on pushes to main: a squash-merged PR was already checked.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go vet, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agents_operator
          POSTGRES_PASSWORD: agents_operator
          POSTGRES_DB: agents_operator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agents_operator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: go test
        env:
          AGENTS_OPERATOR_TEST_DATABASE_URL: postgres://agents_operator:agents_operator@localhost:5432/agents_operator_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: build (stub UI, no Node needed)
        run: go build ./...

  web:
    name: web build and embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go build -tags ui
        run: go build -tags ui ./...
      - name: bundle size (app without xterm must stay under 500 KB gzipped)
        run: |
          size=$(gzip -c internal/ui/dist/assets/index-*.js | wc -c)
          echo "app bundle: ${size} bytes gzipped"
          test "$size" -lt 512000

  chart:
    name: helm lint, unittest, ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: helm dependency update
        run: helm dependency update charts/agents-operator
      - run: helm lint charts/agents-operator --strict
      - name: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest charts/agents-operator
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: helm-docs is up to date
        run: |
          go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 --chart-search-root=charts
          git diff --exit-code -- charts/agents-operator/README.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/chart-testing-action@v2
      - name: ct lint
        run: ct lint --config ct.yaml --charts charts/agents-operator
      - uses: helm/kind-action@v1
        with:
          cluster_name: ct
      - name: server-side validation of every rendered object
        run: |
          kubectl create namespace agents-operator
          helm template hub charts/agents-operator --namespace agents-operator \
            --set postgresql.enabled=false --set database.url=postgres://x \
            | kubectl apply -n agents-operator --dry-run=server -f -
      - name: rbac stays honest (kubectl auth can-i --list)
        run: |
          helm template hub charts/agents-operator --namespace agents-operator --show-only templates/rbac.yaml \
            | kubectl apply -n agents-operator -f -
          kubectl -n agents-operator auth can-i --list --as=system:serviceaccount:agents-operator:hub-agents-operator | tee can-i.txt
          # exactly the verbs from the spec, nothing more
          grep -E '^pods +\[\] +\[\] +\[get list watch create delete\]' can-i.txt
          grep -E '^pods/log +\[\] +\[\] +\[get\]' can-i.txt
          grep -E '^persistentvolumeclaims +\[\] +\[\] +\[get list watch create delete\]' can-i.txt
          grep -E '^secrets +\[\] +\[\] +\[get list watch create update delete\]' can-i.txt
          grep -E '^events +\[\] +\[\] +\[create\]' can-i.txt
          ! grep -E '^(pods/exec|nodes|deployments|namespaces)' can-i.txt
          ! kubectl auth can-i list nodes --as=system:serviceaccount:agents-operator:hub-agents-operator
          ! kubectl -n kube-system auth can-i list pods --as=system:serviceaccount:agents-operator:hub-agents-operator
