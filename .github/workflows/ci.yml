name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go vet, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: go test
        env:
          AGENTHUB_TEST_DATABASE_URL: postgres://agenthub:agenthub@localhost:5432/agenthub_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: build (stub UI, no Node needed)
        run: go build ./...

  web:
    name: web build and embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build -tags ui
        run: go build -tags ui ./...
      - name: bundle size (app without xterm must stay under 500 KB gzipped)
        run: |
          size=$(gzip -c internal/ui/dist/assets/index-*.js | wc -c)
          echo "app bundle: ${size} bytes gzipped"
          test "$size" -lt 512000

  chart:
    name: helm lint, unittest, ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: helm dependency update
        run: helm dependency update charts/agenthub
      - run: helm lint charts/agenthub --strict
      - name: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest charts/agenthub
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: helm-docs is up to date
        run: |
          go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 --chart-search-root=charts
          git diff --exit-code -- charts/agenthub/README.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/chart-testing-action@v2
      - name: ct lint
        run: ct lint --config ct.yaml --charts charts/agenthub --all
      - uses: helm/kind-action@v1
        with:
          cluster_name: ct
      - name: server-side validation of every rendered object
        run: |
          kubectl create namespace agenthub
          helm template hub charts/agenthub --namespace agenthub \
            --set postgresql.enabled=false --set database.url=postgres://x \
            | kubectl apply -n agenthub --dry-run=server -f -
      - name: rbac stays honest (kubectl auth can-i --list)
        run: |
          helm template hub charts/agenthub --namespace agenthub --show-only templates/rbac.yaml \
            | kubectl apply -n agenthub -f -
          kubectl -n agenthub auth can-i --list --as=system:serviceaccount:agenthub:hub-agenthub | tee can-i.txt
          # exactly the verbs from the spec, nothing more
          grep -E '^pods +\[\] +\[\] +\[get list watch create delete\]' can-i.txt
          grep -E '^pods/log +\[\] +\[\] +\[get\]' can-i.txt
          grep -E '^persistentvolumeclaims +\[\] +\[\] +\[get list watch create delete\]' can-i.txt
          grep -E '^secrets +\[\] +\[\] +\[get list watch create update delete\]' can-i.txt
          grep -E '^events +\[\] +\[\] +\[create\]' can-i.txt
          ! grep -E '^(pods/exec|nodes|deployments|namespaces)' can-i.txt
          ! kubectl auth can-i list nodes --as=system:serviceaccount:agenthub:hub-agenthub
          ! kubectl -n kube-system auth can-i list pods --as=system:serviceaccount:agenthub:hub-agenthub

  images:
    name: cross-build images (no push)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agenthub
            file: docker/hub.Dockerfile
          - name: agenthub-runner
            file: docker/runner.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VERSION=${{ github.sha }}
