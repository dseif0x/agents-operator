{{- if .Values.runner.serviceAccount.enabled }}
# A read-only identity session pods may opt into (per session, off by
# default). The token is only mounted into pods that asked for it; the
# account itself never automounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-operator.runnerServiceAccountName" . }}
  labels:
    {{- include "agents-operator.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- if .Values.runner.serviceAccount.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agents-operator.fullname" . }}-runner-{{ .Release.Namespace }}
  labels:
    {{- include "agents-operator.labels" . | nindent 4 }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agents-operator.fullname" . }}-runner
  labels:
    {{- include "agents-operator.labels" . | nindent 4 }}
{{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.runner.serviceAccount.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agents-operator.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
