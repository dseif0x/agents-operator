{{- if not .Values.auth.existingSecret }}
{{- $name := include "agents-operator.authSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $cookie := .Values.auth.cookieSecret }}
{{- $password := "" }}
{{- if $existing }}
{{- if not $cookie }}{{ $cookie = index $existing.data "cookieSecret" | default "" | b64dec }}{{ end }}
{{- $password = index $existing.data "adminPassword" | default "" | b64dec }}
{{- end }}
{{- if not $cookie }}{{ $cookie = randAlphaNum 64 | sha256sum }}{{ end }}
{{- if and (not .Values.auth.adminPasswordHash) (not $password) }}{{ $password = randAlphaNum 20 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agents-operator.labels" . | nindent 4 }}
  annotations:
    # Keep the generated values across upgrades.
    helm.sh/resource-policy: keep
type: Opaque
data:
  cookieSecret: {{ $cookie | b64enc | quote }}
  {{- if .Values.auth.adminPasswordHash }}
  adminPasswordHash: {{ .Values.auth.adminPasswordHash | b64enc | quote }}
  {{- else }}
  adminPassword: {{ $password | b64enc | quote }}
  {{- end }}
{{- end }}
