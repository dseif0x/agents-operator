apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-operator.fullname" . }}
  labels:
    {{- include "agents-operator.labels" . | nindent 4 }}
spec:
  # One replica serves; a rolling update briefly runs two. The reconciler
  # runs in whichever holds the leader Lease, so the overlap is safe and
  # the API, UI and terminals stay up throughout.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "agents-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agents-operator.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum | trunc 32 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agents-operator.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AGENTS_OPERATOR_LISTEN_ADDR
              value: ":8080"
            - name: AGENTS_OPERATOR_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: AGENTS_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTS_OPERATOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENTS_OPERATOR_LEADER_LEASE
              value: {{ include "agents-operator.fullname" . | quote }}
            - name: AGENTS_OPERATOR_RUNNER_IMAGE
              value: {{ .Values.runner.image.repository | quote }}
            - name: AGENTS_OPERATOR_RUNNER_IMAGE_TAG
              value: {{ .Values.runner.image.tag | default .Chart.AppVersion | quote }}
            - name: AGENTS_OPERATOR_RUNNER_IMAGE_PULL_POLICY
              value: {{ .Values.runner.image.pullPolicy | quote }}
            - name: AGENTS_OPERATOR_DEFAULT_STORAGE_CLASS
              value: {{ .Values.runner.storageClass | quote }}
            - name: AGENTS_OPERATOR_DEFAULT_PVC_SIZE
              value: {{ .Values.runner.defaultSize | quote }}
            - name: AGENTS_OPERATOR_DEFAULT_RESOURCES
              value: {{ .Values.runner.resources | toJson | quote }}
            - name: AGENTS_OPERATOR_MAX_RESOURCES
              value: {{ .Values.runner.maxResources | toJson | quote }}
            - name: AGENTS_OPERATOR_RUNNER_NODE_SELECTOR
              value: {{ .Values.runner.nodeSelector | toJson | quote }}
            - name: AGENTS_OPERATOR_RUNNER_TOLERATIONS
              value: {{ .Values.runner.tolerations | toJson | quote }}
            - name: AGENTS_OPERATOR_RUNNER_RUNTIME_CLASS
              value: {{ .Values.runner.runtimeClassName | quote }}
            - name: AGENTS_OPERATOR_RUNNER_SERVICE_ACCOUNT
              value: {{ if .Values.runner.serviceAccount.enabled }}{{ include "agents-operator.runnerServiceAccountName" . | quote }}{{ else }}""{{ end }}
            - name: AGENTS_OPERATOR_RUNNER_NAMESPACE_WRITE
              value: {{ and .Values.runner.serviceAccount.enabled .Values.runner.serviceAccount.namespaceWrite | quote }}
            - name: AGENTS_OPERATOR_RUNNER_READ_CLUSTER_ROLE
              value: {{ .Values.runner.serviceAccount.clusterRole | quote }}
            - name: AGENTS_OPERATOR_RUNNER_WRITE_CLUSTER_ROLE
              value: {{ .Values.runner.serviceAccount.writeClusterRole | quote }}
            - name: AGENTS_OPERATOR_RUNNER_CLUSTER_WIDE_READ
              value: {{ .Values.runner.serviceAccount.clusterWide | quote }}
            - name: AGENTS_OPERATOR_RUNNER_TMP_INIT
              value: {{ .Values.runner.tmpInit | quote }}
            - name: AGENTS_OPERATOR_RUNNER_EXTRA_ENV
              value: {{ .Values.runner.extraEnv | toJson | quote }}
            - name: AGENTS_OPERATOR_IDLE_STOP_AFTER
              value: {{ .Values.runner.idleStopAfter | quote }}
            - name: AGENTS_OPERATOR_ALLOWED_HOSTS
              value: {{ join "," .Values.allowedHosts | quote }}
            - name: AGENTS_OPERATOR_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: AGENTS_OPERATOR_ADMIN_USERNAME
              value: {{ .Values.auth.adminUsername | quote }}
            - name: AGENTS_OPERATOR_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agents-operator.authSecretName" . }}
                  key: cookieSecret
            - name: AGENTS_OPERATOR_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "agents-operator.authSecretName" . }}
                  key: adminPasswordHash
                  optional: true
            - name: AGENTS_OPERATOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agents-operator.authSecretName" . }}
                  key: adminPassword
                  optional: true
            {{- if .Values.postgresql.enabled }}
            - name: AGENTS_OPERATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (include "agents-operator.postgresqlHost" .) }}
                  key: {{ if .Values.postgresql.auth.existingSecret }}{{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}{{ else }}password{{ end }}
            - name: AGENTS_OPERATOR_DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(AGENTS_OPERATOR_DB_PASSWORD)@{{ include "agents-operator.postgresqlHost" . }}:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            {{- else if .Values.database.existingSecret }}
            - name: AGENTS_OPERATOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: AGENTS_OPERATOR_DATABASE_URL
              value: {{ required "database.url is required when postgresql.enabled=false" .Values.database.url | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
