suite: networkpolicy
templates:
  - networkpolicy.yaml
tests:
  - it: is rendered by default and denies everything not listed
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchExpressions[0].key
          value: agents-operator.io/session
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]

  - it: only the hub may reach session pods, on the runner port
    release:
      name: hub
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 7681
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: agents-operator
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: hub

  - it: allows DNS, 443 and 22 outside the cluster ranges
    asserts:
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 0.0.0.0/0
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 10.43.0.0/16
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: TCP
            port: 443
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: TCP
            port: 22

  - it: adds extra egress CIDRs on all ports
    set:
      runner.networkPolicy.egressCIDRs:
        - 10.43.7.7/32
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[2].to[0].ipBlock.cidr
          value: 10.43.7.7/32
      - notExists:
          path: spec.egress[2].ports

  - it: opens the API server for the runner ServiceAccount from the listed CIDRs
    set:
      runner.serviceAccount.enabled: true
      runner.networkPolicy.apiServerCIDRs:
        - 192.168.1.10/32
        - 192.168.1.11/32
      runner.networkPolicy.apiServerPort: 6443
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 4
      - equal:
          path: spec.egress[2].to[0].ipBlock.cidr
          value: 192.168.1.10/32
      - equal:
          path: spec.egress[2].ports[0].port
          value: 6443
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 192.168.1.11/32

  - it: adds no API server rule while the runner ServiceAccount is off
    set:
      runner.networkPolicy.apiServerCIDRs:
        - 192.168.1.10/32
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2

  - it: can be disabled
    set:
      runner.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
