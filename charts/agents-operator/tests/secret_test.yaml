suite: auth secret
templates:
  - secret.yaml
tests:
  - it: generates a cookie secret and a password when nothing is set
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: data.cookieSecret
      - exists:
          path: data.adminPassword
      - notExists:
          path: data.adminPasswordHash

  - it: stores the provided hash instead of a generated password
    set:
      auth.adminPasswordHash: $argon2id$v=19$m=65536,t=3,p=4$c2FsdA$aGFzaA
      auth.cookieSecret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: data.adminPasswordHash
          value: JGFyZ29uMmlkJHY9MTkkbT02NTUzNix0PTMscD00JGMyRnNkQSRhR0Z6YUE=
      - notExists:
          path: data.adminPassword
      - equal:
          path: data.cookieSecret
          value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==

  - it: is skipped with an existing secret
    set:
      auth.existingSecret: sealed
    asserts:
      - hasDocuments:
          count: 0
